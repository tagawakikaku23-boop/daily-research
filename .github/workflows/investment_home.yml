name: 投資HOME検証（架空データのみ）
on:
  workflow_dispatch:
    inputs:
      write_sandbox:
        description: '検証HOMEへ架空データを保存（通常はfalse）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: investment-home-sandbox
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -q
      - name: 架空データの表示検証（書込みなし）
        run: python investment_home.py
      - name: 検証HOMEだけに保存
        if: inputs.write_sandbox
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          INVESTMENT_SANDBOX_WRITES: 'true'
          INVESTMENT_SANDBOX_PAGE_ID: '408fc83b-0e47-81da-b814-e8e4f351dbc9'
        run: python investment_home.py --write-sandbox
