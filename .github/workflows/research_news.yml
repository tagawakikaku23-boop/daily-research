name: General news (manual staging)
# Production schedule is deliberately not enabled before approval.
# Approved target UTC: 0 22 * * * (JST daily 07:00)
on:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
        description: 'Production write requires main and RESEARCH_PUBLISH_ENABLED=true'
      report_date:
        type: string
        required: false
        description: 'JST YYYY-MM-DD for retry; within 48 hours'
permissions:
  contents: read
concurrency:
  group: research-news
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests feedparser groq
      - name: Run independent report
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEARCH_PUBLISH_ENABLED: ${{ vars.RESEARCH_PUBLISH_ENABLED }}
          PUBLISH: ${{ inputs.publish }}
          REPORT_DATE: ${{ inputs.report_date }}
        shell: bash
        run: |
          args=("news")
          if [ -n "$REPORT_DATE" ]; then args+=(--date "$REPORT_DATE"); fi
          if [ "$PUBLISH" = "true" ]; then args+=(--publish); fi
          python research_run.py "${args[@]}"
      - name: Failure summary
        if: failure()
        run: echo 'Research failed or is incomplete. Review the run and private Notion report. No financial data is included in this log.' >> "$GITHUB_STEP_SUMMARY"

