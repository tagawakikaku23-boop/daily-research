name: 毎日リサーチ日報

on:
  # 毎朝7:30（日本時間）に自動実行 = UTC 22:30
  schedule:
    - cron: '30 22 * * *'
  # 手動実行ボタン
  workflow_dispatch:
    inputs:
      reason:
        description: '実行理由（任意）'
        required: false
        default: '手動実行'

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install yfinance feedparser requests groq beautifulsoup4 playwright

      - name: Playwright Chromiumインストール
        run: playwright install chromium --with-deps

      - name: 日報実行
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          NIKKEI_EMAIL: ${{ secrets.NIKKEI_EMAIL }}
          NIKKEI_PASSWORD: ${{ secrets.NIKKEI_PASSWORD }}
          NIIGATA_NIPPO_EMAIL: ${{ secrets.NIIGATA_NIPPO_EMAIL }}
          NIIGATA_NIPPO_PASSWORD: ${{ secrets.NIIGATA_NIPPO_PASSWORD }}
        run: python daily_report.py
