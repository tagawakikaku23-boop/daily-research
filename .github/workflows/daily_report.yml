name: 毎日リサーチ日報

on:
  # 朝07:00（JST）= UTC 22:00 ／ 夜19:00（JST）= UTC 10:00
  schedule:
    - cron: '0 22 * * *'   # 朝レポート
    - cron: '0 10 * * *'   # 夜レポート
  # 手動実行（trigger.html のボタン）。mode未指定なら manual
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード（morning / evening / manual）'
        required: false
        default: 'manual'

# スナップショット（前回シグナル・発掘履歴）をリポジトリへ書き戻すための権限
permissions:
  contents: write

# 同時実行を防ぐ（スナップショットのpush競合回避）
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: パッケージインストール
        run: pip install yfinance feedparser requests groq beautifulsoup4 playwright jpholiday

      - name: Playwright Chromiumインストール
        run: playwright install chromium --with-deps

      - name: 実行モード決定（朝/夜/手動）
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          else
            echo "mode=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: 日報実行（${{ steps.mode.outputs.mode }}）
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          NIKKEI_EMAIL: ${{ secrets.NIKKEI_EMAIL }}
          NIKKEI_PASSWORD: ${{ secrets.NIKKEI_PASSWORD }}
          NIIGATA_NIPPO_EMAIL: ${{ secrets.NIIGATA_NIPPO_EMAIL }}
          NIIGATA_NIPPO_PASSWORD: ${{ secrets.NIIGATA_NIPPO_PASSWORD }}
        run: python daily_report.py ${{ steps.mode.outputs.mode }}

      # 「前回からの変化」用の記憶ファイルを次回実行に引き継ぐ
      # （このワークフローはschedule/dispatch起動のみなので、pushによる再帰起動はない）
      - name: スナップショットを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_snapshot.json last_discovery.json || true
          if git diff --cached --quiet; then
            echo "スナップショット変更なし"
          else
            git commit -m "chore: レポート記憶ファイルを更新 [auto]"
            git pull --rebase origin main || true
            git push
          fi
